function makeCar(color, type) {
  const g = new THREE.Group();

  const L = type === 'suv' ? 4.7 : type === 'pickup' ? 5.3 : 4.5, H = type === 'suv' ? 0.95 : 0.7;

  add(new THREE.BoxGeometry(1.85, H, L), body, 0, 0.32 + H / 2, 0);
  if (type === 'suv') add(new THREE.BoxGeometry(1.7, 0.62, L * 0.66), glass, 0, 0.32 + H + 0.3, L * 0.08);
  else if (type === 'pickup') add(new THREE.BoxGeometry(1.7, 0.6, L * 0.34), glass, 0, 0.32 + H + 0.3, -L * 0.12);
  else add(new THREE.BoxGeometry(1.6, 0.5, L * 0.5), glass, 0, 0.32 + H + 0.25, L * 0.05);

  { shirt: 0xd33a3a, shorts: 0x1d2a5a, skin: 0xc58f66, hair: 0x0b0b0b, s: 0.95, x: -2.5, z: 0.5 },
  { shirt: 0xf0c030, shorts: 0x2a2a2a, skin: 0xb98058, hair: 0x1a0f08, s: 1.05, x: 2.5, z: -2.0 },
  { shirt: 0x2f9a55, shorts: 0x1d2a5a, skin: 0xd09a72, hair: 0x0b0b0b, s: 0.85, x: -1.0, z: 4.0 }
].map(d => {
  const k = buildKid(d.shirt, d.shorts, d.skin, d.hair, d.s); k.g.position.set(d.x, 0, d.z); scene.add(k.g);
  return { obj: k.g, legs: k.legs, arms: k.arms, x: d.x, z: d.z, ph: 0, sx: d.x, sz: d.z, retarget: 0, cd: 0, kickT: 0, voiceT: rnd(1, 4) };
});
function updateKids(dt) {
  const b = ball;
  b.vel.y -= 9.8 * dt; b.pos.addScaledVector(b.vel, dt);
  if (b.pos.y < BR) { b.pos.y = BR; if (b.vel.y < -1.0) ballThump(b.pos, Math.min(1, -b.vel.y / 6)); b.vel.y *= -0.6; if (Math.abs(b.vel.y) < 0.6) b.vel.y = 0; }
  const damp = Math.exp(-(b.pos.y <= BR + 0.02 ? 1.1 : 0.15) * dt); b.vel.x *= damp; b.vel.z *= damp;
  const hitWall = v => { if (v > 2) ballThump(b.pos, Math.min(0.7, v / 8)); };
  if (b.pos.x < -4.3) { b.pos.x = -4.3; hitWall(Math.abs(b.vel.x)); b.vel.x = Math.abs(b.vel.x) * 0.6; }
  if (b.pos.x > 4.3) { b.pos.x = 4.3; hitWall(Math.abs(b.vel.x)); b.vel.x = -Math.abs(b.vel.x) * 0.6; }
  if (b.pos.z < -4.6) { b.pos.z = -4.6; hitWall(Math.abs(b.vel.z)); b.vel.z = Math.abs(b.vel.z) * 0.6; }
  if (b.pos.z > 5.7) { b.pos.z = 5.7; hitWall(Math.abs(b.vel.z)); b.vel.z = -Math.abs(b.vel.z) * 0.6; }
  b.mesh.position.copy(b.pos); b.mesh.rotation.z -= b.vel.x * dt / BR; b.mesh.rotation.x += b.vel.z * dt / BR;
  b.shadow.position.set(b.pos.x, 0.02, b.pos.z); b.shadow.scale.setScalar(1 / (1 + b.pos.y * 1.5));
  b.kickCd -= dt;
  const pdx = b.pos.x - player.position.x, pdz = b.pos.z - player.position.z, pd = Math.hypot(pdx, pdz);
  if (pd < 0.5 && pd > 0.001 && b.pos.y < 0.5 && b.kickCd <= 0) { b.vel.set(pdx / pd * 4.5, 2, pdz / pd * 4.5); b.kickCd = 0.4; kickSound(b.pos); }
  let chaser = 0, best = 1e9;
  kids.forEach((k, i) => { const d = Math.hypot(k.x - b.pos.x, k.z - b.pos.z); if (d < best) { best = d; chaser = i; } });
  kids.forEach((k, i) => {
    k.cd -= dt; k.retarget -= dt; k.voiceT -= dt; k.kickT -= dt;
    let tx, tz;
    if (i === chaser) { tx = b.pos.x + b.vel.x * 0.25; tz = b.pos.z + b.vel.z * 0.25; }
    else { if (k.retarget <= 0) { k.sx = rnd(-3.5, 3.5); k.sz = rnd(-3.5, 5); k.retarget = rnd(1.5, 3); } tx = k.sx; tz = k.sz; }
    const dx = tx - k.x, dz = tz - k.z, d = Math.hypot(dx, dz), sp = i === chaser ? 2.6 : 1.6;
    if (d > 0.25) {

      let diff = Math.atan2(dx, dz) - k.obj.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); k.obj.rotation.y += diff * Math.min(1, dt * 10);
      k.ph += dt * sp * 5; const s = Math.sin(k.ph) * 0.8;
      k.legs[0].rotation.x = s; k.legs[1].rotation.x = -s; k.arms[0].rotation.x = -s; k.arms[1].rotation.x = s;
    } else for (const p of [...k.legs, ...k.arms]) p.rotation.x *= 0.8;
    if (k.kickT > 0) k.legs[0].rotation.x = -1.1 * (k.kickT / 0.25);
    k.x = clamp(k.x, -4.1, 4.1); k.z = clamp(k.z, -4.4, 5.5);
    const px = k.x - player.position.x, pz = k.z - player.position.z, pdist = Math.hypot(px, pz);
    if (pdist < 0.55 && pdist > 0.001) { k.x += px / pdist * (0.55 - pdist); k.z += pz / pdist * (0.55 - pdist); }
    k.obj.position.set(k.x, 0, k.z);
    if (i === chaser && k.cd <= 0 && Math.hypot(k.x - b.pos.x, k.z - b.pos.z) < 0.5 && b.pos.y < 0.45) {
      let j = Math.floor(Math.random() * kids.length); if (j === i) j = (j + 1) % kids.length;
      const tdx = kids[j].x - b.pos.x + rnd(-0.4, 0.4), tdz = kids[j].z - b.pos.z + rnd(-0.4, 0.4), td = Math.hypot(tdx, tdz) || 1, speed = clamp(td * 1.6 + 1.5, 2.5, 7);
      b.vel.set(tdx / td * speed, 1.5 + Math.random() * 2.5, tdz / td * speed); k.cd = 0.8; k.kickT = 0.25; kickSound(b.pos);
      if (Math.random() < 0.35) kidVoice(new THREE.Vector3(k.x, 1, k.z), Math.random() < 0.5 ? 'shout' : 'laugh');
    }
    if (k.voiceT <= 0) { const r = Math.random(); kidVoice(new THREE.Vector3(k.x, 1, k.z), r < 0.55 ? 'shout' : r < 0.75 ? 'yay' : 'laugh'); k.voiceT = rnd(2.5, 7); }
  });
}

// ---------- CONTROLS ----------
const joy = { x: 0, y: 0, id: null }, jbase = document.getElementById('joyBase'), knob = document.getElementById('joyKnob'), JR = 50;
function updateJoy(e) {
  const r = jbase.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const len = Math.hypot(dx, dy);
  if (len > JR) { dx = dx / len * JR; dy = dy / len * JR; } joy.x = dx / JR; joy.y = dy / JR; knob.style.transform = `translate(${dx}px, ${dy}px)`;
}
const resetJoy = () => { joy.x = joy.y = 0; joy.id = null; knob.style.transform = 'translate(0,0)'; };
jbase.addEventListener('pointerdown', e => { joy.id = e.pointerId; jbase.setPointerCapture(e.pointerId); updateJoy(e); });
jbase.addEventListener('pointermove', e => { if (e.pointerId === joy.id) updateJoy(e); });
jbase.addEventListener('pointerup', resetJoy); jbase.addEventListener('pointercancel', resetJoy);
let camYaw = 0, camPitch = 0.35; const camDist = 4.2, looks = new Map(), cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { looks.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const p = looks.get(e.pointerId); if (!p) return;
  camYaw -= (e.clientX - p.x) * 0.006; camPitch = clamp(camPitch + (e.clientY - p.y) * 0.004, 0.05, 1.2); p.x = e.clientX; p.y = e.clientY;
});
const endLook = e => looks.delete(e.pointerId); cv.addEventListener('pointerup', endLook); cv.addEventListener('pointercancel', endLook);
const keys = {}; addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);

// ---------- GAME LOOP ----------
const clock = new THREE.Clock(); let phase = 0, lastStep = 0; const SPEED = 2.6, PR = 0.26;
const hit = (x, z) => colliders.some(c => x > c.x0 - PR && x < c.x1 + PR && z > c.z0 - PR && z < c.z1 + PR);
const blocked = (x, y, z) => colliders.some(c => y < c.h + 0.1 && x > c.x0 - 0.2 && x < c.x1 + 0.2 && z > c.z0 - 0.2 && z < c.z1 + 0.2);
function update(dt) {
  let ix = joy.x, iy = joy.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1; if (keys.KeyS || keys.ArrowDown) iy += 1;
  const mag = Math.min(1, Math.hypot(ix, iy));
  if (mag > 0.08) {
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
    let mx = fx * -iy + rx * ix, mz = fz * -iy + rz * ix; const l = Math.hypot(mx, mz); mx /= l; mz /= l;
    const nx = clamp(player.position.x + mx * SPEED * mag * dt, -16.5, 16.5), nz = clamp(player.position.z + mz * SPEED * mag * dt, -21.4, 5.6);
    if (!hit(nx, player.position.z)) player.position.x = nx; if (!hit(player.position.x, nz)) player.position.z = nz;
    let diff = Math.atan2(mx, mz) - player.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); player.rotation.y += diff * Math.min(1, dt * 10);
    phase += dt * 9 * mag; const s = Math.sin(phase) * 0.7 * mag;
    char.legL.rotation.x = s; char.legR.rotation.x = -s; char.armL.rotation.x = -s * 0.8; char.armR.rotation.x = s * 0.8;
    const n = Math.floor((phase - Math.PI / 2) / Math.PI); if (n !== lastStep) { lastStep = n; footstep(); }
  } else for (const p of [char.legL, char.legR, char.armL, char.armR]) p.rotation.x *= 0.8;
  const tx = player.position.x, ty = 1.4, tz = player.position.z, cp = Math.cos(camPitch);
  const dx = Math.sin(camYaw) * cp * camDist, dy = Math.sin(camPitch) * camDist, dz = Math.cos(camYaw) * cp * camDist;
  let s = 1; for (let t = 0.1; t <= 1.001; t += 0.05) if (blocked(tx + dx * t, ty + dy * t, tz + dz * t)) { s = Math.max(t - 0.1, 0.22); break; }
  camera.position.set(tx + dx * s, Math.max(0.5, ty + dy * s), tz + dz * s); camera.lookAt(tx, ty, tz);
  followLight.position.set(tx, 2.6, tz + 1.2);
  updateKids(dt); updateListener();
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { update(Math.min(clock.getDelta(), 0.05)); renderer.render(scene, camera); });
</script>
